name: Build Flet App

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # https://flet.dev/docs/reference/environment-variables
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Desktop --------
          - name: macos
            runner: macos-26
            build_cmd: "flet build macos --arch arm64"
            artifact_path: build/macos
            needs_linux_deps: false

          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows"
            artifact_path: build/windows
            needs_linux_deps: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Clean ignored files before packaging
        shell: bash
        run: git clean -ffdx

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
            sudo apt update --allow-releaseinfo-change
            LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
            sudo apt-get install -y --no-install-recommends $LINUX_DEPS
            sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          test -s models/maintenance_classifier.joblib
          uv run python -c "from func.maintenance_ml_classifier import MaintenanceMLClassifier; model = MaintenanceMLClassifier.load(); assert model.is_fitted"
          uv run python scripts/validate_desktop_icons.py
          uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Verify Flet package scope and model
        shell: bash
        run: |
          uv run python scripts/validate_flet_package.py "${{ matrix.artifact_path }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
