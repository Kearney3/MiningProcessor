name: Build Flet App

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'releases/**']
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  # https://flet.dev/docs/reference/environment-variables
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Desktop --------
          - name: macos
            runner: macos-26
            build_cmd: "flet build macos --arch arm64"
            artifact_path: build/macos
            needs_linux_deps: false

          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows"
            artifact_path: build/windows
            needs_linux_deps: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Clean ignored files before packaging
        shell: bash
        run: git clean -ffdx

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
            sudo apt update --allow-releaseinfo-change
            LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
            sudo apt-get install -y --no-install-recommends $LINUX_DEPS
            sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          test -s models/maintenance_classifier.joblib
          uv run python -c "from func.maintenance_ml_classifier import MaintenanceMLClassifier; model = MaintenanceMLClassifier.load(); assert model.is_fitted"
          uv run python scripts/validate_desktop_icons.py
          uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Verify Flet package scope and model
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          artifact = Path("${{ matrix.artifact_path }}")
          archives = list(artifact.rglob("app.zip"))
          if not archives:
              raise SystemExit(f"app.zip not found under {artifact}")

          forbidden_roots = {
              ".DS_Store", ".agents", ".claude", ".codex", ".codex_work", ".codegraph",
              ".cursor", ".git", ".github", ".idea", ".maintenance_llm.env",
              ".pytest_cache", ".ruff_cache", ".serena", ".trellis", ".venv",
              ".vscode", ".worktrees", "Notebook", "build", "build-sidecar",
              "config.user.json", "data", "dist", "docs", "node_modules", "outputs",
              "public", "src", "src-tauri", "tests", "wheels",
          }
          model_suffix = "models/maintenance_classifier.joblib"
          for archive in archives:
              with ZipFile(archive) as package:
                  names = package.namelist()
                  roots = {name.split("/", 1)[0] for name in names if name}
                  unexpected = sorted(forbidden_roots & roots)
                  if unexpected:
                      raise SystemExit(
                          f"unexpected files in Flet app.zip: {', '.join(unexpected)}"
                      )
                  root_data_files = sorted(
                      name
                      for name in names
                      if "/" not in name
                      and name.lower().endswith(
                          (".csv", ".db", ".jsonl", ".log", ".xls", ".xlsx")
                      )
                  )
                  if root_data_files:
                      raise SystemExit(
                          "unexpected root-level data files in Flet app.zip: "
                          + ", ".join(root_data_files)
                      )
                  if not any(name.endswith(model_suffix) for name in names):
                      raise SystemExit(
                          f"maintenance classifier is missing from {archive}"
                      )
              size_mb = archive.stat().st_size / (1024 * 1024)
              print(f"Verified {archive}: {size_mb:.1f} MiB")
              if size_mb > 300:
                  raise SystemExit(
                      f"Flet app.zip is unexpectedly large ({size_mb:.1f} MiB)"
                  )
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
