[project]
name = "MiningProcessor"
version = "3.0.1"
description = "矿山运营 Excel 报表批量处理工具 — 支持 CLI 与 Tauri 桌面应用"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "openpyxl>=3.1.2",
    "pandas>=3.0.2",
    "xlsxwriter>=3.0.0",
    "python-calamine>=0.1.0",
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9,<3.0",
    "xlrd>=2.0.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
fuel = "func.excel_fuel:main"
electrical = "func.excel_electrical:main"
production = "func.excel_production_enhanced:main"
worktime = "func.excel_worktime:main"
worktime-batch = "func.excel_worktime_multifile:main"
merge = "func.excel_merger:main"
sync-minebase = "func.sync_to_minebase:main"
maintenance-train = "func.train_maintenance_classifier:main"
maintenance-llm-label = "func.label_maintenance_with_llm:main"

[dependency-groups]
dev = [
    "pillow>=10.3.0",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["func"]

[tool.hatch.build.targets.wheel.force-include]
"models/maintenance_classifier.joblib" = "models/maintenance_classifier.joblib"
"models/maintenance_classifier.metrics.json" = "models/maintenance_classifier.metrics.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "build",
    "dist",
    "node_modules",
    ".venv",
    "src-tauri",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long — enforced gradually, not on day 1
    "RUF001", # ambiguous unicode in strings (Chinese/Mongolian text)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B011",  # assert in tests is fine
    "SIM300",# Yoda conditions in assertions
]

[tool.ruff.lint.isort]
known-first-party = ["func"]
