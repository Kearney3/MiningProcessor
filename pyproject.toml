[project]
name = "MiningProcessor"
version = "2.1.2"
description = "矿山运营 Excel 报表批量处理工具 — 支持 CLI 与 Flet 桌面 GUI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "openpyxl>=3.1.2",
    "pandas>=3.0.2",
    "flet>=0.21.0",
    "xlsxwriter>=3.0.0",
    "python-calamine>=0.1.0",
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9,<3.0",
    "xlrd>=2.0.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
MiningProcessor = "gui.main:main"
fuel = "func.excel_fuel:main"
electrical = "func.excel_electrical:main"
production = "func.excel_production_enhanced:main"
worktime = "func.excel_worktime:main"
worktime-batch = "func.excel_worktime_multifile:main"
merge = "func.excel_merger:main"
sync-minebase = "func.sync_to_minebase:main"
maintenance-train = "func.train_maintenance_classifier:main"
maintenance-llm-label = "func.label_maintenance_with_llm:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["func", "gui"]

[tool.hatch.build.targets.wheel.force-include]
"models/maintenance_classifier.joblib" = "models/maintenance_classifier.joblib"
"models/maintenance_classifier.metrics.json" = "models/maintenance_classifier.metrics.json"

[tool.flet.app]
# 只打包当前生效模型；训练轮次与候选模型不进入桌面安装包。
exclude = ["models/maintenance_classifier_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
